version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/user.sql"
    schema: "../../deploy/schema/user.sql"
    gen:
      go:
        package: "user"
        out: "user"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    queries: "sql/post.sql"
    schema:
      - "../../deploy/schema/post.sql"
      - "../../deploy/schema/user.sql"
      - "../../deploy/schema/baby.sql"
    gen:
      go:
        package: "post"
        out: "post"
        sql_package: "pgx/v5"
