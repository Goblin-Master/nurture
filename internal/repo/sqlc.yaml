version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/user.sql"
    schema: "../../deploy/schema/user.sql"
    gen:
      go:
        package: "user"
        out: "user"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    queries: "sql/baby.sql"
    schema: "../../deploy/schema/baby.sql"
    gen:
      go:
        package: "baby"
        out: "baby"
        sql_package: "pgx/v5"
