app:
  host: 0.0.0.0  #  0.0.0.0 监听所有接口
  port: 8080
  env: dev
  log: logs/   # 日志文件路径，要加个 /
auth:
  access_secret: nurture
  access_expire: 86400
db:
  enable: false
  host: nurture-pg  # 数据库容器名
  port: 5432
  username: nurture
  password: 123456
  dbname: nurture
redis:
  host: nurture-redis  # 缓存容器名
  port: 6379
  password:
  db: 0
  enable: true
rabbitmq:
  host: nurture-rabbitmq  # RabbitMQ 容器名
  port: 5672
  username: nurture
  password: 123456
  vhost: /
  enable: true
minio:
  enable: false
  endpoint: "xxxxxx" # minio 地址, 格式: ip:port,千万不要暴露地址
  access_key: "xxxxxx" # minio 登录账号
  secret_key: "xxxxxx" # minio 登录密码
  use_ssl: false
  bucket: "xxxxxx" # minio 存储桶名称
email:
  enable: false
  domain: "smtp.qq.com"
  port: 587
  send_email: "xxxxxx" # 发送邮箱
  auth_code: "xxxxxx" # 发送邮箱的授权码
  send_nickname: "孕育拓扑队"
  subject: "稚慧灵"
  ssl: false
  tls: false

sms:
  enable: false
  key: "xxxxxx"
  endpoint: "https://push.spug.cc/send/%s"

ai:
  chat:
    enable: false
    provider: openai
    model: glm-4v-flash
    api_key: xxxxxx
    base_url: https://open.bigmodel.cn/api/paas/v4/
    timeout: 3000
  embedding:
    enable: false
    provider: siliconflow
    model: BAAI/bge-m3
    api_key: xxxxxx
    base_url: https://api.siliconflow.cn/v1
  chunking:
    chunk_size: 1000
    chunk_overlap: 200
  retrieval:
    default_top_k: 3
    similarity_threshold: 0.7
  kb_config:
    enable: false
    search_private: false
    search_public: false
    top_k: 3
