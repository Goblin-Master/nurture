app:
  host: 127.0.0.1
  port: 8080
  env : dev
  log : logs
auth:
  access_secret: nurture
  access_expire: 86400
db:
  host: 127.0.0.1
  port: 5432
  username: nurture
  password: 123456
  dbname: nurture
redis:
  host: 127.0.0.1
  port: 6379
  password:
  db: 0
  enable: true
minio:
  endpoint: "xxxxxx" # minio 地址, 格式: ip:port,千万不要暴露地址
  access_key: "xxxxxx" # minio 登录账号
  secret_key: "xxxxxx" # minio 登录密码
  use_ssl: false
  bucket: "xxxxxx" # minio 存储桶名称
email:
  domain: "smtp.qq.com"
  port: 587
  send_email: "xxxxxx" # 发送邮箱
  auth_code: "xxxxxx" # 发送邮箱的授权码
  send_nickname: "孕育拓扑队"
  subject: "稚慧云"
  ssl: false
  tls: false
ai:
  chat:
    provider: openai
    model: glm-4v-flash
    api_key: xxxxxx
    base_url: https://open.bigmodel.cn/api/paas/v4/
    timeout: 3000
  embedding:
    provider: openai
    model: embedding-3
    api_key: xxxxxx
    base_url: https://open.bigmodel.cn/api/paas/v4/
  chunking:
    chunk_size: 1000
    chunk_overlap: 200
  retrieval:
    default_top_k: 3
    similarity_threshold: 0.7
